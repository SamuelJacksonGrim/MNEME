[project]
name = "mneme"
version = "0.1.0"
description = "Self-reinforcing CoT training loop. Past success and failure metrics become food for the next generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later OR Apache-2.0" }
authors = [{ name = "Samuel Jackson Grim" }]

[project.urls]
Homepage = "https://github.com/SamuelJacksonGrim/MNEME"
Repository = "https://github.com/SamuelJacksonGrim/MNEME"

[tool.setuptools.packages.find]
where = ["."]
include = ["mneme*"]
